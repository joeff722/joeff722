<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card">
        <header class="header">
          <h1>待辦清單</h1>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
            <span id="theme-toggle-icon" aria-hidden="true">🌙</span>
            <span id="theme-toggle-label">深色模式</span>
          </button>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <input
            id="todo-input"
            type="text"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
          />
          <button type="submit">新增</button>
        </form>

        <nav class="todo-filters" aria-label="篩選待辦事項">
          <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
        </nav>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <footer class="footer">
          <span id="todo-summary">未完成: 0 項</span>
          <button
            id="clear-completed"
            class="clear-completed"
            type="button"
            aria-label="清除所有已完成的待辦事項"
            disabled
          >
            清除已完成
          </button>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
